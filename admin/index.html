<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard | Jetour Admin</title>
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="admin-topbar">
  <div class="container admin-topbar-inner">
    <div class="admin-brand">
      <svg class="brand-mark" viewBox="0 0 40 40" role="img" aria-label="Jetour International Ltd. logo">
        <rect width="40" height="40" fill="#155EEF"></rect>
        <path d="M0 40 L40 40 L0 0 Z" fill="#16A34A"></path>
        <path d="M0 0 L40 40" stroke="#F8FAFC" stroke-width="2"></path>
      </svg>
      JETOUR<span>Admin</span>
    </div>
    <nav class="admin-nav" aria-label="Admin">
      <a href="index.html" aria-current="page">Dashboard</a>
      <a href="enquiries.html">Enquiries</a>
      <a href="settings.html">Settings</a>
    </nav>
    <div class="admin-account">
      <span data-admin-email></span>
      <button type="button" class="btn btn-outline btn-small" data-logout-btn>Logout</button>
    </div>
  </div>
</header>

<main class="admin-main">
  <div class="container">

    <div class="admin-warning" data-supabase-warning>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r=".6" fill="currentColor" stroke="none"/></svg>
      <span>Supabase is not configured yet. Add the project URL and anon key to js/config.js.</span>
    </div>

    <div class="admin-page-head">
      <h1>Dashboard</h1>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <span>Total Enquiries</span>
        <strong data-count-total>...</strong>
      </div>
      <div class="stat-card">
        <span>New</span>
        <strong data-count-new>...</strong>
      </div>
      <div class="stat-card">
        <span>Vehicle</span>
        <strong data-count-vehicle>...</strong>
      </div>
      <div class="stat-card">
        <span>Agriculture</span>
        <strong data-count-agriculture>...</strong>
      </div>
    </div>

    <h2 style="margin-bottom:16px;">Recent Enquiries</h2>
    <div class="data-table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Status</th>
            <th>Date</th>
            <th></th>
          </tr>
        </thead>
        <tbody data-recent-enquiries>
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </div>
</main>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Sign In | Jetour International Ltd.</title>
<link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <svg class="brand-mark" viewBox="0 0 40 40" role="img" aria-label="Jetour International Ltd. logo">
      <rect width="40" height="40" fill="#155EEF"></rect>
      <path d="M0 40 L40 40 L0 0 Z" fill="#16A34A"></path>
      <path d="M0 0 L40 40" stroke="#F8FAFC" stroke-width="2"></path>
    </svg>
    <h1>Admin Sign In</h1>
    <p>Sign in to manage enquiries and site settings.</p>

    <div class="admin-warning" data-supabase-warning>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16" r=".6" fill="currentColor" stroke="none"/></svg>
      <span>Supabase is not configured yet. Add the project URL and anon key to js/config.js.</span>
    </div>

    <div class="login-error" data-login-error></div>

    <form data-login-form novalidate>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-login-submit>Sign In</button>
    </form>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
